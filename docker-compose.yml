services:
  postgres:
    image: postgres:17-alpine
    container_name: analytix-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytix}
      POSTGRES_USER: ${POSTGRES_USER:-analytix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - analytix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytix} -d ${POSTGRES_DB:-analytix}"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges

volumes:
  analytix-postgres-data:
